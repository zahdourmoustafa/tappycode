name: Windows GG Coder App pickers and commands

# What a phone paired to a Windows PC gets for GG Coder App: the released GG
# Coder installer and tappy.exe, the app actually open, and a fake phone that
# asks exactly what the Android app asks — the chat list, the model/thinking
# pickers and the `/` list, before a chat and inside one.
on:
  workflow_dispatch:
    inputs:
      gg_version:
        description: "GG Coder release tag (default: latest)"
        required: false
      tappy_version:
        description: "tappy release tag (default: latest)"
        required: false

permissions:
  contents: read

jobs:
  controls:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - name: Install the released GG Coder and tappy
        shell: pwsh
        run: |
          $gg = "${{ inputs.gg_version }}"; if (-not $gg) { $gg = (gh release view -R zahdourmoustafa/gg-coder --json tagName --jq .tagName) }
          $tp = "${{ inputs.tappy_version }}"; if (-not $tp) { $tp = (gh release view -R $env:GITHUB_REPOSITORY --json tagName --jq .tagName) }
          "GG Coder $gg, tappy $tp"
          New-Item -ItemType Directory -Force dl | Out-Null
          gh release download $gg -R zahdourmoustafa/gg-coder -p "*x64-setup.exe" -D dl
          gh release download $tp -R $env:GITHUB_REPOSITORY -p tappy-windows-x64.exe -D dl
          $setup = Get-ChildItem dl -Filter "*setup.exe" | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/S" -PassThru -Wait
          "GG Coder installer exit=$($p.ExitCode)"
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\tappy" | Out-Null
          Copy-Item dl\tappy-windows-x64.exe "$env:LOCALAPPDATA\tappy\tappy.exe"
          & "$env:LOCALAPPDATA\tappy\tappy.exe" --version

      - name: Open GG Coder, as the user has it open
        shell: pwsh
        run: |
          Start-Process "$env:LOCALAPPDATA\GG Coder\gg-app.exe"
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            $c = Get-ChildItem "$env:USERPROFILE\.gg\app-connections\*.json" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($c) { break }
          }
          if (-not $c) { "GG Coder never wrote its connection file"; exit 1 }
          Start-Sleep -Seconds 8
          $j = Get-Content $c.FullName | ConvertFrom-Json
          $h = @{ "x-gg-token" = $j.token }
          $w = (Invoke-RestMethod "http://127.0.0.1:$($j.port)/windows" -Headers $h).windows
          "windows: $($w | ConvertTo-Json -Compress)"
          $sid = $w[0].sessionId
          $h["x-gg-session"] = $sid
          $m = (Invoke-RestMethod "http://127.0.0.1:$($j.port)/models" -Headers $h).models
          "app models: $($m.Count)"
          $cm = (Invoke-RestMethod "http://127.0.0.1:$($j.port)/commands" -Headers $h).commands
          "app commands: $($cm.Count)"
          try { $sk = (Invoke-RestMethod "http://127.0.0.1:$($j.port)/skills" -Headers $h).skills; "app skills: $($sk.Count)" } catch { "app skills: route missing ($($_.Exception.Message))" }
          "PROJECT=$($w[0].cwd)" | Out-File -Append $env:GITHUB_ENV

      - name: Serve, pair like a phone, read pickers and commands
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\serve.log"; $err = "$env:RUNNER_TEMP\serve.err.log"
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\tappy\tappy.exe" -ArgumentList "serve" `
            -RedirectStandardOutput $log -RedirectStandardError $err -WindowStyle Hidden -PassThru
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "\[relay\] online" -Quiet)) { break }
          }
          $env:PROBE_PROVIDER = "ggcoder-app"
          $env:PROBE_CONTROLS_CWD = $env:PROJECT
          bun run packages/daemon/src/testing/phone-pair-probe.ts
          $probe = $LASTEXITCODE
          "--- serve.log"; Get-Content $log | Select-String -NotMatch "[█▀▄]"
          "--- serve.err.log"; Get-Content $err -Tail 60
          if ($probe -ne 0) { exit 1 }
