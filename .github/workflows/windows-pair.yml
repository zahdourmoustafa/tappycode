name: Windows pairing

# Reproduces what a Windows user does — install the released tappy.exe, start
# it, pair a phone — on a real Windows machine, and keeps the daemon's logs.
# Run by hand from the Actions tab, or on any push that touches this file.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to install (default: latest)"
        required: false
  push:
    paths:
      - .github/workflows/windows-pair.yml
      - packages/daemon/src/testing/phone-pair-probe.ts

permissions:
  contents: read

jobs:
  pair:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - name: Install the released tappy.exe exactly as users do
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.version }}"
          if (-not $tag) { $tag = (gh release view -R $env:GITHUB_REPOSITORY --json tagName --jq .tagName) }
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\tappy" | Out-Null
          gh release download $tag -R $env:GITHUB_REPOSITORY -p tappy-windows-x64.exe -O "$env:LOCALAPPDATA\tappy\tappy.exe" --clobber
          & "$env:LOCALAPPDATA\tappy\tappy.exe" --version

      - name: Start tappy serve in the background
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\serve.log"
          $err = "$env:RUNNER_TEMP\serve.err.log"
          Start-Process -FilePath "$env:LOCALAPPDATA\tappy\tappy.exe" -ArgumentList "serve" `
            -RedirectStandardOutput $log -RedirectStandardError $err -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "\[relay\] online" -Quiet)) { break }
            Start-Sleep -Milliseconds 500
          }
          Get-Content $log -ErrorAction SilentlyContinue | Select-String -NotMatch "[█▀▄]"
          Get-Content $err -ErrorAction SilentlyContinue

      - name: Pair like a phone (twice, with a rotation between)
        shell: pwsh
        run: |
          bun run packages/daemon/src/testing/phone-pair-probe.ts
          $first = $LASTEXITCODE
          & "$env:LOCALAPPDATA\tappy\tappy.exe" pair --rotate --no-wait | Select-String -NotMatch "[█▀▄]"
          Start-Sleep -Seconds 3
          $env:PROBE_DEVICE = "phone-ci-probe-2"
          bun run packages/daemon/src/testing/phone-pair-probe.ts
          $second = $LASTEXITCODE
          "first=$first second=$second"
          if ($first -ne 0 -or $second -ne 0) { exit 1 }

      - name: What the daemon logged
        if: always()
        shell: pwsh
        run: |
          "--- serve.log"; Get-Content "$env:RUNNER_TEMP\serve.log" -ErrorAction SilentlyContinue | Select-String -NotMatch "[█▀▄]"
          "--- serve.err.log"; Get-Content "$env:RUNNER_TEMP\serve.err.log" -ErrorAction SilentlyContinue
          "--- doctor"; & "$env:LOCALAPPDATA\tappy\tappy.exe" doctor
          "--- background service install + its error log"
          & "$env:LOCALAPPDATA\tappy\tappy.exe" service install
          Start-Sleep -Seconds 20
          Get-Content "$env:USERPROFILE\.tappy\logs\daemon.error.log" -Tail 40 -ErrorAction SilentlyContinue
          Get-Content "$env:USERPROFILE\.tappy\logs\daemon.log" -Tail 20 -ErrorAction SilentlyContinue | Select-String -NotMatch "[█▀▄]"
