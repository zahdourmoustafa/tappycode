name: Windows pairing

# Reproduces what a Windows user does — install the released tappy.exe, start
# it, pair a phone — on a real Windows machine, and keeps the daemon's logs.
# Run by hand from the Actions tab, or on any push that touches this file.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to install (default: latest)"
        required: false
  push:
    paths:
      - .github/workflows/windows-pair.yml
      - packages/daemon/src/testing/phone-pair-probe.ts

permissions:
  contents: read

jobs:
  pair:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - name: Install the released tappy.exe exactly as users do
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.version }}"
          if (-not $tag) { $tag = (gh release view -R $env:GITHUB_REPOSITORY --json tagName --jq .tagName) }
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\tappy" | Out-Null
          gh release download $tag -R $env:GITHUB_REPOSITORY -p tappy-windows-x64.exe -O "$env:LOCALAPPDATA\tappy\tappy.exe" --clobber
          & "$env:LOCALAPPDATA\tappy\tappy.exe" --version

      - name: Serve, watch it, and pair like a phone
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\serve.log"
          $err = "$env:RUNNER_TEMP\serve.err.log"
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\tappy\tappy.exe" -ArgumentList "serve" `
            -RedirectStandardOutput $log -RedirectStandardError $err -WindowStyle Hidden -PassThru
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            $online = (Test-Path $log) -and (Select-String -Path $log -Pattern "\[relay\] online" -Quiet)
            "t=$($i*0.5)s alive=$(-not $p.HasExited) online=$online"
            if ($p.HasExited) { "EXITED code=$($p.ExitCode)"; break }
          }
          "--- probe 1"
          bun run packages/daemon/src/testing/phone-pair-probe.ts
          "probe1=$LASTEXITCODE alive=$(-not $p.HasExited)"
          if ($p.HasExited) { "EXITED code=$($p.ExitCode)" }
          "--- netstat 8787"; netstat -ano | Select-String ":8787"
          "--- health"; try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/health -TimeoutSec 5).StatusCode } catch { "health failed: $($_.Exception.Message)" }
          "--- serve.log"; Get-Content $log | Select-String -NotMatch "[█▀▄]"
          "--- serve.err.log"; Get-Content $err

      - name: Background service (what tappy setup installs), then pair against it
        if: always()
        shell: pwsh
        run: |
          Get-Process tappy -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          & "$env:LOCALAPPDATA\tappy\tappy.exe" service install
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/health -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          "service health ok=$ok after ${i}s"
          Start-Sleep -Seconds 5
          $env:PROBE_DEVICE = "phone-ci-service"
          bun run packages/daemon/src/testing/phone-pair-probe.ts
          $probe = $LASTEXITCODE
          "--- doctor"; & "$env:LOCALAPPDATA\tappy\tappy.exe" doctor
          "--- daemon.error.log"; Get-Content "$env:USERPROFILE\.tappy\logs\daemon.error.log" -Tail 40 -ErrorAction SilentlyContinue
          "--- daemon.log"; Get-Content "$env:USERPROFILE\.tappy\logs\daemon.log" -Tail 20 -ErrorAction SilentlyContinue | Select-String -NotMatch "[█▀▄]"
          if (-not $ok -or $probe -ne 0) { exit 1 }
