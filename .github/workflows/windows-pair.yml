name: Windows pairing

# Reproduces what a Windows user does — install the released tappy.exe, start
# it, pair a phone — on a real Windows machine, and keeps the daemon's logs.
# Run by hand from the Actions tab, or on any push that touches this file.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to install (default: latest)"
        required: false
  push:
    paths:
      - .github/workflows/windows-pair.yml
      - packages/daemon/src/testing/phone-pair-probe.ts
      - install.ps1
      - packages/daemon/src/**

permissions:
  contents: read

jobs:
  pair:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - name: The one-line installer users run (install.ps1 from this commit)
        shell: powershell
        env:
          TAPPY_NO_PAIR: "1"
          TAPPY_INSTALL_DIR: ${{ runner.temp }}\tappy-installer
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          "install.ps1 took $([int]$sw.Elapsed.TotalSeconds)s"
          & "$env:TAPPY_INSTALL_DIR\tappy.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install the released tappy.exe exactly as users do
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.version }}"
          if (-not $tag) { $tag = (gh release view -R $env:GITHUB_REPOSITORY --json tagName --jq .tagName) }
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\tappy" | Out-Null
          gh release download $tag -R $env:GITHUB_REPOSITORY -p tappy-windows-x64.exe -O "$env:LOCALAPPDATA\tappy\tappy.exe" --clobber
          & "$env:LOCALAPPDATA\tappy\tappy.exe" --version

      - name: Serve, watch it, and pair like a phone
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\serve.log"
          $err = "$env:RUNNER_TEMP\serve.err.log"
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\tappy\tappy.exe" -ArgumentList "serve" `
            -RedirectStandardOutput $log -RedirectStandardError $err -WindowStyle Hidden -PassThru
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            $online = (Test-Path $log) -and (Select-String -Path $log -Pattern "\[relay\] online" -Quiet)
            "t=$($i*0.5)s alive=$(-not $p.HasExited) online=$online"
            if ($p.HasExited) { "EXITED code=$($p.ExitCode)"; break }
          }
          "--- probe 1"
          bun run packages/daemon/src/testing/phone-pair-probe.ts
          "probe1=$LASTEXITCODE alive=$(-not $p.HasExited)"
          if ($p.HasExited) { "EXITED code=$($p.ExitCode)" }
          "--- netstat 8787"; netstat -ano | Select-String ":8787"
          "--- health"; try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/health -TimeoutSec 5).StatusCode } catch { "health failed: $($_.Exception.Message)" }
          "--- serve.log"; Get-Content $log | Select-String -NotMatch "[█▀▄]"
          "--- serve.err.log"; Get-Content $err

      - name: Background service (what tappy setup installs), then pair against it
        if: always()
        shell: pwsh
        run: |
          Get-Process tappy -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          & "$env:LOCALAPPDATA\tappy\tappy.exe" service install
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/health -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          "service health ok=$ok after ${i}s"
          Start-Sleep -Seconds 5
          $env:PROBE_DEVICE = "phone-ci-probe"  # the device that already claimed this pairing
          bun run packages/daemon/src/testing/phone-pair-probe.ts
          $probe = $LASTEXITCODE
          "--- doctor"; & "$env:LOCALAPPDATA\tappy\tappy.exe" doctor
          "--- daemon.error.log"; Get-Content "$env:USERPROFILE\.tappy\logs\daemon.error.log" -Tail 40 -ErrorAction SilentlyContinue
          "--- daemon.log"; Get-Content "$env:USERPROFILE\.tappy\logs\daemon.log" -Tail 20 -ErrorAction SilentlyContinue | Select-String -NotMatch "[█▀▄]"
          if (-not $ok -or $probe -ne 0) { exit 1 }

  # The GG Coder App provider, through a tappy.exe compiled from this commit —
  # the path every Windows user is on, and the one no source-checkout test can
  # reach: the provider launches tappy itself, which only works if the binary
  # recognises that it is compiled.
  gg-app:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - name: Compile tappy.exe from this commit, as the release does
        shell: pwsh
        run: |
          bun build --compile --minify --target=bun-windows-x64 packages/daemon/src/cli/index.ts --outfile tappy.exe
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\tappy" | Out-Null
          Copy-Item tappy.exe "$env:LOCALAPPDATA\tappy\tappy.exe"
          & "$env:LOCALAPPDATA\tappy\tappy.exe" --version

      - name: A machine that has used GG Coder app (one saved chat)
        shell: pwsh
        run: |
          # Written with JSON.stringify, as GG Coder itself writes it: a
          # hand-built PowerShell string mis-escaped the Windows path.
          bun -e "
            const fs = require('node:fs'); const path = require('node:path'); const os = require('node:os');
            const home = os.homedir(); const proj = path.join(home, 'myproject');
            fs.mkdirSync(proj, { recursive: true });
            fs.mkdirSync(path.join(home, '.gg', 'app-connections'), { recursive: true });
            const dir = path.join(home, '.gg', 'sessions', 'C--Users-runneradmin-myproject');
            fs.mkdirSync(dir, { recursive: true });
            const lines = [
              { type: 'session', version: 2, id: 'conv-1', conversationId: 'conv-1', cwd: proj },
              { type: 'message', id: 'm1', message: { role: 'user', content: 'Build the login page' } },
              { type: 'message', id: 'm2', message: { role: 'assistant', content: [{ type: 'text', text: 'Done' }] } },
            ];
            fs.writeFileSync(path.join(dir, '2026-10-22T10-00-00-000Z_abcd1234.jsonl'), lines.map((l) => JSON.stringify(l)).join('\n') + '\n');
            console.log('wrote chat for', proj);
          "

      - name: Serve, pair like a phone, ask GG Coder App for its chats
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\serve.log"; $err = "$env:RUNNER_TEMP\serve.err.log"
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\tappy\tappy.exe" -ArgumentList "serve" `
            -RedirectStandardOutput $log -RedirectStandardError $err -WindowStyle Hidden -PassThru
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "\[relay\] online" -Quiet)) { break }
          }
          $env:PROBE_PROVIDER = "ggcoder-app"
          bun run packages/daemon/src/testing/phone-pair-probe.ts
          $probe = $LASTEXITCODE
          "--- serve.log"; Get-Content $log | Select-String -NotMatch "[█▀▄]"
          "--- serve.err.log"; Get-Content $err
          if ($probe -ne 0) { exit 1 }
